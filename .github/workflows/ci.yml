name: CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  AWS_REGION: us-east-1
  # Fake URL: `prisma generate` only parses it, never connects. Overridable via a repo variable.
  PRISMA_GENERATE_DATABASE_URL: ${{ vars.PRISMA_GENERATE_DATABASE_URL || 'postgresql://prisma:prisma@localhost:5432/prisma?schema=public' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      - name: Lint
        working-directory: app
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      - name: Unit tests with coverage
        working-directory: app
        run: npm run test:cov

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      - name: E2E tests with coverage
        working-directory: app
        run: npm run test:e2e:cov

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      - name: Build
        working-directory: app
        run: npm run build

  db-validation:
    name: DB Validation (Ephemeral)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: techchallenge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      # Ephemeral DB only: db:reset (migrate reset + seed) proves migrations apply
      # from empty and the seed runs. The Postgres service container is discarded
      # with the job — this never touches a real database.
      - name: Reset and seed the throwaway database
        working-directory: app
        run: npm run db:reset
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/techchallenge?schema=public

  tf-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Terraform Fmt Check
        run: terraform fmt -check -recursive
        working-directory: infra
      - name: Terraform Init Infra AWS (no backend)
        run: terraform init -backend=false -no-color
        working-directory: infra/aws-base
      - name: Terraform Validate Infra AWS
        run: terraform validate -no-color
        working-directory: infra/aws-base
      - name: Terraform Init Kubernetes (no backend)
        run: terraform init -backend=false -no-color
        working-directory: infra/k8s-base
      - name: Terraform Validate Kubernetes
        run: terraform validate -no-color
        working-directory: infra/k8s-base
      - name: Configure AWS Credentials
        id: aws_creds
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Plan Infra AWS
        if: steps.aws_creds.outcome == 'success'
        working-directory: infra/aws-base
        run: |
          terraform init -reconfigure -no-color
          terraform plan -no-color
      - name: Terraform Plan Kubernetes (if cluster provisioned)
        if: steps.aws_creds.outcome == 'success'
        working-directory: infra/k8s-base
        env:
          TF_VAR_k8s_postgres_password: ${{ secrets.K8S_POSTGRES_PASSWORD }}
        run: |
          if terraform -chdir=../aws-base output -raw cluster_name >/dev/null 2>&1; then
            terraform init -reconfigure -no-color
            terraform plan -no-color
          else
            echo "aws-base has no outputs yet (never applied) — skipping k8s-base plan."
          fi
      - name: Note skipped plan in job summary
        if: steps.aws_creds.outcome == 'failure'
        run: |
          {
            echo '### Terraform plan — skipped ⏭️'
            echo ''
            echo 'The target environment appears to be unavailable, so `terraform plan` was skipped. **This does not block CI** — `fmt` and `validate` passed. Re-run once the environment is back up to preview the plan.'
          } >> "$GITHUB_STEP_SUMMARY"

  open-pr:
    name: Open Pull Request
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
      - e2e-tests
      - build
      - db-validation
      - tf-validate
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Open a PR to master if none exists
        env:
          GH_TOKEN: ${{ secrets.OPEN_PR_TOKEN }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "${HEAD_BRANCH}" --base master --state open --json number --jq 'length')"
          if [[ "${existing}" != "0" ]]; then
            echo "An open PR already exists for ${HEAD_BRANCH} -> master; nothing to do."
            exit 0
          fi
          gh pr create \
            --base master \
            --head "${HEAD_BRANCH}" \
            --title "${HEAD_BRANCH}" \
            --body "Automated PR opened by CI after all checks passed on \`${HEAD_BRANCH}\`."
