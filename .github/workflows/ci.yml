name: CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  AWS_REGION: us-east-1
  # Fake URL: `prisma generate` only parses it, never connects. Overridable via a repo variable.
  PRISMA_GENERATE_DATABASE_URL: ${{ vars.PRISMA_GENERATE_DATABASE_URL || 'postgresql://prisma:prisma@localhost:5432/prisma?schema=public' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      - name: Lint
        working-directory: app
        run: npm run lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      - name: Unit tests with coverage
        working-directory: app
        run: npm run test:cov
      - name: Upload unit coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage
          path: app/coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      - name: E2E tests with coverage
        working-directory: app
        run: npm run test:e2e:cov

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      - name: Build
        working-directory: app
        run: npm run build

  db-validation:
    name: DB Validation (Ephemeral)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: techchallenge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-ci
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.PRISMA_GENERATE_DATABASE_URL }}
      # Ephemeral DB only: db:reset (migrate reset + seed) proves migrations apply
      # from empty and the seed runs. The Postgres service container is discarded
      # with the job — this never touches a real database.
      - name: Reset and seed the throwaway database
        working-directory: app
        run: npm run db:reset
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/techchallenge?schema=public

  sast:
    name: SAST
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Restore coverage from the Unit Tests job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unit-coverage
          path: app/coverage
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        with:
          projectBaseDir: app
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  tf-validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Fmt Check
        run: terraform fmt -check -recursive
        working-directory: infra
      - name: Terraform Init Infra AWS
        run: terraform init -no-color
        working-directory: infra/aws-base
      - name: Terraform Validate Infra AWS
        run: terraform validate -no-color
        working-directory: infra/aws-base
      - name: Terraform Init Kubernetes
        run: terraform init -no-color
        working-directory: infra/k8s-workflows
      - name: Terraform Validate Kubernetes
        run: terraform validate -no-color
        working-directory: infra/k8s-workflows
      - name: Terraform Plan Infra AWS
        run: terraform plan -no-color
        working-directory: infra/aws-base
      # k8s-workflows plan needs the aws-base outputs (cluster info), which exist
      # once aws-base is applied. Plan it when the cluster is provisioned; skip
      # gracefully on a fresh project where aws-base was never applied.
      - name: Terraform Plan Kubernetes (if cluster provisioned)
        working-directory: infra/k8s-workflows
        env:
          TF_VAR_k8s_postgres_password: ${{ secrets.K8S_POSTGRES_PASSWORD }}
        run: |
          if terraform -chdir=../aws-base output -raw cluster_name >/dev/null 2>&1; then
            terraform plan -no-color
          else
            echo "aws-base has no outputs yet (never applied) — skipping k8s-workflows plan."
          fi

  open-pr:
    name: Open Pull Request
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
      - e2e-tests
      - build
      - db-validation
      - sast
      - tf-validate
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Open a PR to master if none exists
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "${HEAD_BRANCH}" --base master --state open --json number --jq 'length')"
          if [[ "${existing}" != "0" ]]; then
            echo "An open PR already exists for ${HEAD_BRANCH} -> master; nothing to do."
            exit 0
          fi
          gh pr create \
            --base master \
            --head "${HEAD_BRANCH}" \
            --title "${HEAD_BRANCH}" \
            --body "Automated PR opened by CI after all checks passed on \`${HEAD_BRANCH}\`."
