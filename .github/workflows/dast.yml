name: DAST

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: dast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_PROJECT: dast
  COMPOSE_FILE: app/docker-compose.yml
  API_BASE_URL: http://localhost:3000
  SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
  SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}

jobs:
  zap-scan:
    name: OWASP ZAP Passive Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Start the target stack
        run: docker compose -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" up -d --build

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "$API_BASE_URL/api/docs" >/dev/null 2>&1; then
              echo "API is ready after ${i} attempt(s)."
              exit 0
            fi
            echo "Waiting for the API... (attempt ${i}/60)"
            sleep 5
          done
          echo "::error::API did not become ready in time."
          docker compose -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" logs --no-color --tail 200
          exit 1

      - name: Perform authentication for the scan
        run: |
          echo "::add-mask::$SEED_ADMIN_PASSWORD"
          token="$(curl -fsS -X POST "$API_BASE_URL/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"${SEED_ADMIN_EMAIL}\",\"password\":\"${SEED_ADMIN_PASSWORD}\"}" \
            | jq -r '.data.accessToken')"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Failed to authenticate against /api/auth/login."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "ZAP_AUTH_HEADER_VALUE=Bearer $token" >> "$GITHUB_ENV"

      - name: Prepare the ZAP work directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/zap-work"
          cp .zap/rules.tsv "$GITHUB_WORKSPACE/zap-work/rules.tsv"
          chmod -R 777 "$GITHUB_WORKSPACE/zap-work"

      - name: Run OWASP ZAP API scan
        run: |
          docker run --rm \
            --network "${COMPOSE_PROJECT}_default" \
            -v "$GITHUB_WORKSPACE/zap-work:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER=Authorization \
            -e ZAP_AUTH_HEADER_VALUE="$ZAP_AUTH_HEADER_VALUE" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t http://api:3000/api/docs-json \
              -f openapi \
              -c rules.tsv \
              -r zap-report.html \
              -J zap-report.json

      - name: Upload the ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: |
            zap-work/zap-report.html
            zap-work/zap-report.json
          if-no-files-found: warn

      - name: Tear down the stack
        if: always()
        run: docker compose -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" down -v
