name: CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  build-push-image:
    name: Build and Push App Image
    runs-on: ubuntu-latest
    environment: production
    if: vars.ENABLE_DEPLOY == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    outputs:
      image_uri: ${{ steps.image_meta.outputs.image_uri }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Set image metadata
        id: image_meta
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE_URI="${{ steps.login_ecr.outputs.registry }}/${ECR_REPOSITORY}:${COMMIT_SHA}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./app
          push: true
          tags: |
            ${{ steps.image_meta.outputs.image_uri }}
            ${{ steps.login_ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
          build-args: |
            DATABASE_URL=${{ vars.PRISMA_GENERATE_DATABASE_URL || 'postgresql://prisma:prisma@localhost:5432/prisma?schema=public' }}
            SERVICE_VERSION=${{ github.sha }}

  db-migrate:
    name: DB Migrate & Seed
    runs-on: ubuntu-latest
    environment: production
    needs:
      - build-push-image
    if: vars.ENABLE_DEPLOY == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Falha rápido e com causa explícita, antes de gastar uma autenticação AWS e
      # um kubectl apply: sem este secret, o Secret do cluster sobe com um valor
      # vazio ou malformado, o pod da API entra em CrashLoopBackOff, e o
      # TypeError do passport-jwt no log do pod não diz o que realmente faltou.
      - name: Validate required secrets
        env:
          CUSTOMER_JWT_PUBLIC_KEY: ${{ secrets.CUSTOMER_JWT_PUBLIC_KEY }}
        run: |
          if [ -z "${CUSTOMER_JWT_PUBLIC_KEY}" ]; then
            echo "::error::CUSTOMER_JWT_PUBLIC_KEY não está configurado nos secrets do repositório."
            exit 1
          fi
          case "${CUSTOMER_JWT_PUBLIC_KEY}" in
            *"BEGIN PUBLIC KEY"*) ;;
            *) echo "::error::CUSTOMER_JWT_PUBLIC_KEY não parece uma chave pública PEM."; exit 1 ;;
          esac

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "${{ env.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER_NAME }}"

      - name: Render and apply API secrets and ConfigMap
        env:
          DB_USER: ${{ vars.DB_USER || 'techchallenge' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || secrets.TF_VAR_DB_PASSWORD }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT || '5432' }}
          DB_NAME: ${{ vars.DB_NAME || 'techchallenge' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          CUSTOMER_JWT_PUBLIC_KEY: ${{ secrets.CUSTOMER_JWT_PUBLIC_KEY }}
        # `kubectl create secret --from-literal` (não `envsubst` sobre o YAML) porque
        # CUSTOMER_JWT_PUBLIC_KEY é uma chave PEM que pode conter quebras de linha reais —
        # envsubst injetaria o valor cru dentro do stringData e quebraria o YAML renderizado
        # (a segunda linha do PEM começa na coluna 0, sem `:`), derrubando o `kubectl apply`
        # antes da migração e do rollout. --from-literal aceita o valor como está, com
        # quebras de linha ou não, e o próprio kubectl faz o escape para o Secret.
        run: |
          kubectl create secret generic api-secret \
            --namespace "${{ vars.K8S_NAMESPACE }}" \
            --from-literal=DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public" \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            --from-literal=JWT_REFRESH_SECRET="${JWT_REFRESH_SECRET}" \
            --from-literal=CUSTOMER_JWT_PUBLIC_KEY="${CUSTOMER_JWT_PUBLIC_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f k8s/02-api-configmap.yaml

      - name: Apply DB migration Job
        id: db_job
        run: |
          JOB_NAME="db-migrate-${{ github.run_id }}-${{ github.run_attempt }}"
          IMAGE_URI="${{ needs.build-push-image.outputs.image_uri }}"

          echo "job_name=${JOB_NAME}" >> "$GITHUB_OUTPUT"

          RENDERED="$(sed -e "s|JOB_NAME_PLACEHOLDER|${JOB_NAME}|g" \
                          -e "s|IMAGE_URI_PLACEHOLDER|${IMAGE_URI}|g" \
                        k8s/00-db-migrate-job.yaml)"

          echo "----- rendered Job manifest -----"
          echo "${RENDERED}"
          echo "${RENDERED}" | kubectl apply -f -

      - name: Wait DB migration Job completion
        run: |
          JOB_NAME="${{ steps.db_job.outputs.job_name }}"
          NAMESPACE="${{ vars.K8S_NAMESPACE }}"

          if ! kubectl wait --for=condition=Complete "job/${JOB_NAME}" -n "${NAMESPACE}" --timeout=900s; then
            echo "Job ${JOB_NAME} did not complete successfully. Collecting diagnostics..."
            kubectl describe job "${JOB_NAME}" -n "${NAMESPACE}" || true
            POD_NAME="$(kubectl get pods -n "${NAMESPACE}" -l job-name="${JOB_NAME}" -o jsonpath='{.items[0].metadata.name}')"
            if [[ -n "${POD_NAME}" ]]; then
              kubectl logs -n "${NAMESPACE}" "${POD_NAME}" --all-containers=true || true
            fi
            exit 1
          fi

      - name: Show DB migration Job logs
        run: |
          JOB_NAME="${{ steps.db_job.outputs.job_name }}"
          NAMESPACE="${{ vars.K8S_NAMESPACE }}"
          POD_NAME="$(kubectl get pods -n "${NAMESPACE}" -l job-name="${JOB_NAME}" -o jsonpath='{.items[0].metadata.name}')"
          if [[ -n "${POD_NAME}" ]]; then
            kubectl logs -n "${NAMESPACE}" "${POD_NAME}" --all-containers=true
          fi

  app-deploy:
    name: App Deploy
    runs-on: ubuntu-latest
    environment: production
    needs:
      - build-push-image
      - db-migrate
    if: vars.ENABLE_DEPLOY == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "${{ env.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER_NAME }}"

      - name: Render deployment manifest with immutable image
        run: |
          sed "s|IMAGE_URI_PLACEHOLDER|${{ needs.build-push-image.outputs.image_uri }}|g" \
            k8s/03-api-deployment.yaml > k8s/03-api-deployment.rendered.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/03-mailhog-deployment.yaml
          kubectl apply -f k8s/04-mailhog-service.yaml
          kubectl apply -f k8s/03-api-deployment.rendered.yaml
          kubectl apply -f k8s/04-api-service.yaml
          kubectl apply -f k8s/05-api-hpa.yaml

      - name: Wait rollout
        run: kubectl rollout status deployment/${{ vars.K8S_DEPLOYMENT_NAME }} --namespace=${{ vars.K8S_NAMESPACE }} --timeout=180s
