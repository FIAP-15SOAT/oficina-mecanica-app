services:
  postgres:
    image: postgres:16-alpine
    container_name: techchallange-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: techchallange
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: techchallange-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Sobrescreve DATABASE_URL do .env: dentro do Docker o host é o nome do serviço, não localhost
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/techchallange?schema=public
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
