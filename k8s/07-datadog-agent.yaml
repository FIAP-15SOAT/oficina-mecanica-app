apiVersion: v1
kind: ServiceAccount
metadata:
  name: datadog-agent
  namespace: oficina
  labels:
    app.kubernetes.io/name: datadog-agent
    app.kubernetes.io/part-of: oficina-mecanica

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datadog-agent
  labels:
    app.kubernetes.io/name: datadog-agent
    app.kubernetes.io/part-of: oficina-mecanica

# Somente leitura, e só o que alimenta métricas de pod, estado de réplica e
# enriquecimento de tags. Nada de escrita, nada de secrets.
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/spec, nodes/proxy, nodes/stats]
    verbs: [get, list, watch]

  - apiGroups: [""]
    resources: [pods, services, endpoints, namespaces, events]
    verbs: [get, list, watch]

  - apiGroups: [apps]
    resources: [deployments, replicasets, daemonsets, statefulsets]
    verbs: [get, list, watch]

  - nonResourceURLs: [/metrics, /healthz, /version]
    verbs: [get]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datadog-agent
  labels:
    app.kubernetes.io/name: datadog-agent
    app.kubernetes.io/part-of: oficina-mecanica

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datadog-agent

subjects:
  - kind: ServiceAccount
    name: datadog-agent
    namespace: oficina

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: datadog-agent
  namespace: oficina
  labels:
    app.kubernetes.io/name: datadog-agent
    app.kubernetes.io/part-of: oficina-mecanica

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: datadog-agent

  template:
    metadata:
      labels:
        app.kubernetes.io/name: datadog-agent
        app.kubernetes.io/part-of: oficina-mecanica

    spec:
      serviceAccountName: datadog-agent

      # O agente precisa alcançar o kubelet do próprio node.
      hostNetwork: false
      dnsPolicy: ClusterFirst

      tolerations:
        - operator: Exists

      containers:
        - name: agent
          image: gcr.io/datadoghq/agent:7.60.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: otlp-http
              containerPort: 4318
              protocol: TCP

          env:
            - name: DD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: datadog-secret
                  key: DD_API_KEY

            - name: DD_SITE
              value: us5.datadoghq.com

            - name: DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT
              value: 0.0.0.0:4318

            - name: DD_APM_ENABLED
              value: "true"

            - name: DD_LOGS_ENABLED
              value: "true"
            - name: DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL
              value: "true"

            - name: DD_CONTAINER_EXCLUDE_LOGS
              value: "name:mailhog name:agent name:kube-proxy"

            # O check `orchestrator_pod` fala com um Cluster Agent, que este
            # projeto não implanta — só há o DaemonSet. Sem ele o check falha
            # para sempre e nunca produz dado
            - name: DD_ORCHESTRATOR_EXPLORER_ENABLED
              value: "false"

            - name: DD_KUBELET_TLS_VERIFY
              value: "false"

            - name: DD_CLUSTER_NAME
              value: oficina-mecanica

            - name: DD_KUBERNETES_KUBELET_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi

          # ⚠️ Sem mount de socket de runtime. Nós EKS otimizados rodam
          # **containerd**, não Docker: `/var/run/docker.sock` não existe, e o
          # `type: Socket` do Kubernetes exige que o caminho exista — o pod
          # ficaria preso em `ContainerCreating`. O agente obtém metadado de
          # container pela API do kubelet, já configurada em
          # `DD_KUBERNETES_KUBELET_HOST`, que é o caminho suportado aqui.
          volumeMounts:
            - name: procdir
              mountPath: /host/proc
              readOnly: true
            - name: cgroups
              mountPath: /host/sys/fs/cgroup
              readOnly: true
            - name: pointerdir
              mountPath: /opt/datadog-agent/run
            - name: logpodpath
              mountPath: /var/log/pods
              readOnly: true

      volumes:
        - name: procdir
          hostPath:
            path: /proc
        - name: cgroups
          hostPath:
            path: /sys/fs/cgroup
        # Sobrevive ao restart do agente: sem isto, cada reinício reenviaria os
        # logs desde o começo do arquivo.
        - name: pointerdir
          hostPath:
            path: /var/lib/datadog-agent/run
            type: DirectoryOrCreate
        # `/var/log/pods` é o caminho do kubelet, independente do runtime, e é
        # o suficiente para a coleta de log em containerd — os arquivos sob
        # `/var/lib/docker/containers` só existem com Docker e eram, junto do
        # socket, o resto da premissa errada.
        - name: logpodpath
          hostPath:
            path: /var/log/pods
