apiVersion: v1
kind: Service
metadata:
  name: mailhog
  namespace: oficina
  labels:
    app.kubernetes.io/name: mailhog
    app.kubernetes.io/part-of: oficina-mecanica

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: mailhog

  ports:
    - name: smtp
      protocol: TCP
      port: 1025
      targetPort: smtp

    - name: http
      protocol: TCP
      port: 8025
      targetPort: http