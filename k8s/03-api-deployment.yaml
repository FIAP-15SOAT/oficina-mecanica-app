apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-api
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oficina-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oficina-api
        app.kubernetes.io/part-of: oficina-mecanica
    spec:
      containers:
        - name: api
          image: IMAGE_URI_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: NODE_ENV

            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: PORT

            - name: JWT_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: JWT_EXPIRATION
 
            - name: JWT_REFRESH_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: JWT_REFRESH_EXPIRATION
 
            - name: BCRYPT_SALT_ROUNDS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: BCRYPT_SALT_ROUNDS
 
            - name: MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: MAIL_HOST
 
            - name: MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: MAIL_PORT
 
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: TZ

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: LOG_LEVEL

            - name: OTEL_SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: OTEL_SERVICE_NAME

            - name: OTEL_SERVICE_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: OTEL_SERVICE_NAMESPACE

            - name: TRUSTED_PROXY_CIDRS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: TRUSTED_PROXY_CIDRS

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DATABASE_URL

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: JWT_SECRET
 
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: JWT_REFRESH_SECRET
 
            - name: QUOTE_DECISION_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: QUOTE_DECISION_TOKEN_SECRET
          readinessProbe:
            httpGet:
              path: /api/docs
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/docs
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
