apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-api
    app.kubernetes.io/part-of: oficina-mecanica
type: Opaque
stringData:
  # `sslmode=require&uselibpqcompat=true` é obrigatório contra o RDS: o parameter group
  # `default.postgres16` traz `rds.force_ssl = 1`, e o node-postgres (`prisma db seed` e o
  # `pg.Pool` do `PrismaService`) não usa TLS sem `sslmode` na string — ao contrário do motor
  # do `prisma migrate deploy`, que negocia TLS por conta própria. `uselibpqcompat=true`
  # mantém a semântica libpq de `require` (cifra sem validar a cadeia), necessária porque a
  # raiz do RDS é autoassinada e não está no truststore do Node. Mesmo valor em `cd.yml`.
  DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public&sslmode=require&uselibpqcompat=true
  JWT_SECRET: ${JWT_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  CUSTOMER_JWT_PUBLIC_KEY: ${CUSTOMER_JWT_PUBLIC_KEY}