services:
  postgres:
    image: postgres:16-alpine
    container_name: techchallenge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: techchallenge
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: techchallenge-api:local
    build: &api-build
      context: .
      args:
        DATABASE_URL: postgresql://postgres:postgres@postgres:5432/techchallenge?schema=public
    container_name: techchallenge-migrate
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/techchallenge?schema=public
      TZ: America/Sao_Paulo
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: techchallenge-api:local
    build: *api-build
    container_name: techchallenge-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/techchallenge?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-in-production}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      QUOTE_DECISION_TOKEN_SECRET: ${QUOTE_DECISION_TOKEN_SECRET:-change-me-quote-decision-in-production}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  mailhog:
    image: mailhog/mailhog:latest
    container_name: techchallenge-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

volumes:
  postgres_data:
